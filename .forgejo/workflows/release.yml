# Release: tag `v*` -> signed macOS app + static Linux daemon.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Artifacts land on the tag's Forgejo release page:
#   GrandCentralTerminal-<ver>-macos-arm64.zip  (signed, notarized, stapled)
#   gctd-<ver>-linux-x86_64.tar.gz              (gctd + ptyexec, static stdlib)
#
# Required repo secrets (/{owner}/{repo}/settings/actions/secrets):
#   APPLE_CERT_P12_B64  base64 of the Developer ID Application .p12
#   APPLE_CERT_PASSWORD password for the .p12 (empty string when none)
#
# Runner labels: `macos-arm64` (challenger-macos-arm64) and `linux`.
# Rename to match your runner labels if they differ.
"on":
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign, notarize
        run: ./scripts/release-macos.sh
        env:
          VERSION: ${{ forgejo.ref_name }}
          APPLE_CERT_P12_B64: ${{ secrets.APPLE_CERT_P12_B64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      - name: Publish to release
        run: |
          TAG="${{ forgejo.ref_name }}"
          VER="${TAG#v}"
          ./scripts/forgejo-release-upload.sh "$TAG" \
            "build/GrandCentralTerminal-${VER}-macos-arm64.zip"
        env:
          FORGEJO_URL: ${{ forgejo.server_url }}
          FORGEJO_REPO: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

  linux:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
      - name: Build static daemon tarball
        run: ./scripts/release-linux.sh
        env:
          VERSION: ${{ forgejo.ref_name }}
      - name: Publish to release
        run: |
          TAG="${{ forgejo.ref_name }}"
          VER="${TAG#v}"
          ART=(build/gctd-"${VER}"-linux-*.tar.gz)
          ./scripts/forgejo-release-upload.sh "$TAG" "${ART[0]}"
        env:
          FORGEJO_URL: ${{ forgejo.server_url }}
          FORGEJO_REPO: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
