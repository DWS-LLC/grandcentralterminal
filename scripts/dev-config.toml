# Dev canvas config (scripts/dev.sh). Loud on purpose: never mistake the
# working-tree build for the live install. Unset keys take defaults.

# Roomy gaps and a camera that recenters on focus moves without re-zooming
# (easier to eyeball cables and layouts). Root keys come before any table.
window-gap = 64
camera-fits-focus-move = false

[background]
# Transparent red.
dark = "#770000"
light = "#770000"

[titlebar]
# Borders share the titlebar color: ugly blue.
background = "#0000ff"
text = "#ffffff"

[doom]
# The live canvas owns ctrl+space (a system-wide hotkey).
toggle = "ctrl+alt+space"
start-hidden = false
launch-at-login = false
